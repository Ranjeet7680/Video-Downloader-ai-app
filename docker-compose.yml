version: '3.8'

services:
  video-downloader-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-downloader-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - META_API_KEY=${META_API_KEY:-}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Persistent download history, users, and subscription database
      - ./data:/app/data
      # Downloaded videos and cached media files
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
